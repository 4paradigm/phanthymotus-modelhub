# 每个文件钉死 size + SHA256，revision 钉死到 commit：下载器在落盘前校验，
# 截断或被换掉的 shard 进不来。serve 段是起 vLLM 的参数：
#   memory_gb         内存预算（Jetson 统一内存，换算成 --gpu-memory-utilization）
#   max_model_len     上下文上限，直接决定 KV cache 占多少
#   tool_call_parser  agent-core 每轮都带工具，没有它模型只会把工具调用写进正文
