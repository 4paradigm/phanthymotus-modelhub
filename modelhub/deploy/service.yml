# Compose service fragment for ModelHub.
#
# agent-core 的部署和 run-pr-image.sh 都从镜像里读这个文件（/deploy/service.yml），
# 把 __IMAGE__ 换成实际镜像后合进主机的 docker-compose.yml —— 这个文件就是部署本身。
modelhub:
  image: __IMAGE__
  container_name: embodied-modelhub
  # GPU 由宿主机的 nvidia runtime 挂进来（驱动库 libcuda 等只能用宿主机的，镜像带不了）。
  # 和 perception / actucore 的片段同一种写法，整个机群一种。
  # 曾经用过 CDI：一台 Thor（R39.2）上 dockerd 没重启、没加载 nvidia runtime，只能走
  # CDI；另一台（星源智 N4，R38.4）正相反，nvidia runtime 是默认 runtime 而没有 CDI
  # 描述文件。前者是宿主机配置没生效（daemon.json 写了），重启一次 dockerd 即可。
  runtime: nvidia
  network_mode: host
  # vLLM 的 worker 进程之间走共享内存，容器默认 64 MB 的 /dev/shm 不够
  ipc: host
  volumes:
    # 和 perception / actucore 同一个模型卷。ModelHub 只用其中的 modelhub/ 子目录
    # （config.yaml 的 root），权重、状态、编译缓存全在那里：
    #   /opt/embodied/models/modelhub/{models/<id>, state, cache}
    - /opt/embodied/models:/models
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  # 机器人重启后自动起来，并自动加载上次选的模型
  restart: always
